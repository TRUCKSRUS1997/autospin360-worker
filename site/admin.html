.login-wrap{max-width:340px; margin:80px auto; padding:24px; background:var(--panel); border:1px solid var(--line); border-radius:14px}
.login-wrap h1{font-size:18px}
.row{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px}
.vlist{border:1px solid var(--line); border-radius:12px; overflow:hidden}
.vrow{display:flex; align-items:center; gap:12px; padding:10px 12px; border-bottom:1px solid var(--line)}
.vrow:last-child{border-bottom:0}
.vrow .thumb{width:64px; height:44px; border-radius:6px; background:var(--panel2); overflow:hidden; flex:none; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:10px}
.vrow .thumb img{width:100%; height:100%; object-fit:cover}
.vrow .meta{flex:1; min-width:0}
.vrow .meta b{display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.vrow .actions{display:flex; gap:6px; flex:none}

.sheet h2{font-size:19px; margin-bottom:14px}

<script>
const esc = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app = document.getElementById('app');
const topNav = document.getElementById('topNav');
let currentUser = null;

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
async function api(url, opts) {
  const r = await fetch(url, Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts));
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) throw new Error((data && data.error) || ('Request failed (' + r.status + ')'));
  return data;
}

async function uploadBlob(vehicleId, kind, blob) {
  const r = await fetch(`/api/upload?vehicleId=${encodeURIComponent(vehicleId)}&kind=${kind}`, {
    method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: blob,
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Upload failed');
  return data.url;
}
function deletePhoto(url) {
  return fetch('/api/upload', { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url }) }).catch(() => {});
}

let tesseractReady = null;
function ensureTesseract() {
  if (window.Tesseract) return Promise.resolve();
  if (tesseractReady) return tesseractReady;
  tesseractReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = resolve; s.onerror = () => reject(new Error('Could not load the text scanner'));
    document.head.appendChild(s);
  });
  return tesseractReady;
}

let zxingReady = null;
function ensureZXing() {
  if (window.ZXingBrowser) return Promise.resolve();
  if (zxingReady) return zxingReady;
  zxingReady = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/@zxing/browser@latest';
    s.onload = resolve; s.onerror = () => reject(new Error('Could not load the barcode scanner'));
    document.head.appendChild(s);
  });
  return zxingReady;
}
// VINs never contain I, O, or Q.
const VIN_RE = /[A-HJ-NPR-Z0-9]{17}/g;
function bestVinGuess(text) {
  const clean = text.toUpperCase().replace(/[^A-Z0-9]/g, ' ');
  const matches = clean.match(VIN_RE);
  if (!matches || !matches.length) return '';
  // Prefer a match with a plausible mix of letters and digits (real VINs have both).
  matches.sort((a, b) => {
    const score = s => (/[A-Z]/.test(s) ? 1 : 0) + (/[0-9]/.test(s) ? 1 : 0);
    return score(b) - score(a);
  });
  return matches[0];
}

// The window sticker almost always carries the VIN in a scannable code too — either a Code 39
// barcode of the bare VIN, or a QR code (often a URL to an online window-sticker page with the
// VIN embedded in it). ZXing checks all common formats, so one call covers both; the decoded
// text might be a bare VIN or might have it embedded in a longer URL, so we extract rather than
// require an exact match.
async function tryDecodeVinCode(file) {
  try {
    await ensureZXing();
    const url = URL.createObjectURL(file);
    const img = new Image();
    await new Promise((ok, bad) => { img.onload = ok; img.onerror = bad; img.src = url; });
    const result = await new ZXingBrowser.BrowserMultiFormatReader().decodeFromImageElement(img);
    URL.revokeObjectURL(url);
    return bestVinGuess((result && result.getText && result.getText()) || '');
  } catch (e) {
    return ''; // no scannable code on the label, or it couldn't be read — the AI readers still run
  }
}

// Shrinks the photo (long edge 1600px) and returns base64 JPEG for the AI readers.
async function photoToBase64(file) {
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.88));
  return await new Promise((ok, bad) => {
    const fr = new FileReader();
    fr.onload = () => ok(String(fr.result).split(',')[1]);
    fr.onerror = () => bad(new Error('Could not read the photo'));
    fr.readAsDataURL(blob);
  });
}

function showVinConfirm(panel, previewUrl, guess, onConfirm) {
  panel.insertAdjacentHTML('beforeend', `
    <div class="confirm">
      <input class="input" id="vinGuess" maxlength="17" style="text-transform:uppercase" value="${esc(guess)}" placeholder="17-character VIN">
    </div>
    <div class="foot">
      <button type="button" class="btn" id="vinScanCancel">Cancel</button>
      <button type="button" class="btn primary" id="vinScanUse">Use this VIN</button>
    </div>`);
  panel.querySelector('#vinScanCancel').addEventListener('click', () => { panel.hidden = true; panel.innerHTML = ''; URL.revokeObjectURL(previewUrl); });
  panel.querySelector('#vinScanUse').addEventListener('click', () => {
    const v = panel.querySelector('#vinGuess').value.trim().toUpperCase();
    if (v.length !== 17) { toast('A VIN is 17 characters — check for typos.'); return; }
    panel.hidden = true; panel.innerHTML = ''; URL.revokeObjectURL(previewUrl);
    onConfirm(v);
  });
}

// Scan order: barcode / QR code first (exact), then two AI readers that cross-check each other
// (server-side, /api/scan-vin), then on-device text recognition if the AI readers aren't set up.
async function scanVinPhoto(overlay, file, onConfirm) {
  const panel = overlay.querySelector('#vinScanPanel');
  const previewUrl = URL.createObjectURL(file);
  panel.hidden = false;
  panel.innerHTML = `
    <div class="row2">
      <img src="${previewUrl}" alt="">
      <div class="col">
        <div class="status"><span class="spin" style="width:14px;height:14px"></span> <span id="vinStatusTxt">Checking for a barcode or QR code…</span></div>
        <div class="raw" id="vinRaw"></div>
        <div class="reads" id="vinReads"></div>
      </div>
    </div>`;
  const statusTxt = () => panel.querySelector('#vinStatusTxt');
  const setStatus = html => { const s = panel.querySelector('.status'); if (s) s.innerHTML = html; };

  const codeVin = await tryDecodeVinCode(file);
  if (codeVin) {
    setStatus('<span>Read from a code on the label — double-check it below:</span>');
    showVinConfirm(panel, previewUrl, codeVin, onConfirm);
    return;
  }

  // AI readers
  statusTxt().textContent = 'No code found — reading the label with two AI readers…';
  try {
    const image = await photoToBase64(file);
    const r = await fetch('/api/scan-vin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image }) });
    const d = await r.json().catch(() => ({}));
    if (r.status === 401) throw new Error('Session expired — log in again.');
    if (r.ok) {
      const names = { groq: 'Reader A', gemini: 'Reader B' };
      panel.querySelector('#vinReads').innerHTML = (d.reads || []).filter(x => !x.skipped).map(x =>
        `${names[x.source] || x.source}: <b>${esc(x.vin || (x.error ? 'error' : 'not found'))}</b>${x.vin ? (x.valid ? ' <span class="ok">✓</span>' : ' <span class="warn">?</span>') : ''}`).join('<br>');
      if (d.vin) {
        setStatus(d.agree
          ? `<span class="ok">Both AI readers agree${d.confidence === 'high' ? ' and the check digit is valid' : ''} — confirm below:</span>`
          : '<span class="warn">The readers did not fully agree — check every character:</span>');
        showVinConfirm(panel, previewUrl, d.vin, onConfirm);
        return;
      }
      // neither AI reader found a VIN — fall through to text recognition
    }
  } catch (err) {
    if (/Session expired/.test(err.message)) { statusTxt().textContent = err.message; panel.querySelector('.spin') && panel.querySelector('.spin').remove(); return; }
    // otherwise fall through to on-device text recognition
  }

  statusTxt().textContent = 'Reading the printed text…';
  try {
    await ensureTesseract();
    const { data } = await window.Tesseract.recognize(file, 'eng');
    const guess = bestVinGuess(data.text || '');
    panel.querySelector('#vinRaw').textContent = (data.text || '').trim().slice(0, 200);
    setStatus(guess
      ? '<span>Found a possible VIN — check it below:</span>'
      : '<span>Could not find a clear VIN. You can type it in below.</span>');
    showVinConfirm(panel, previewUrl, guess, onConfirm);
  } catch (err) {
    statusTxt().textContent = 'Could not read that photo: ' + err.message;
    const sp = panel.querySelector('.spin'); if (sp) sp.remove();
  }
}
async function decodeVin(vin, overlay, onData) {
  const f = sel => overlay.querySelector(sel);
  try {
    const data = await api('/api/decode-vin?vin=' + encodeURIComponent(vin));
    const filled = [];
    if (data.year && !f('#fYear').value) { f('#fYear').value = data.year; filled.push('year'); }
    if (data.make && !f('#fMake').value) { f('#fMake').value = data.make; filled.push('make'); }
    if (data.model && !f('#fModel').value) { f('#fModel').value = data.model; filled.push('model'); }
    if (data.trim && !f('#fTrim').value) { f('#fTrim').value = data.trim; filled.push('trim'); }
    if (data.drivetrain && !f('#fDrive').value) { f('#fDrive').value = data.drivetrain; filled.push('drivetrain'); }
    if (data.fuel && !f('#fFuel').value) { f('#fFuel').value = data.fuel; filled.push('fuel'); }
    if (data.engine && !f('#fEngine').value) { f('#fEngine').value = data.engine; filled.push('engine'); }
    if (data.transmission && !f('#fTrans').value) { f('#fTrans').value = data.transmission; filled.push('transmission'); }
    if (onData) onData(data);
    toast(filled.length ? `VIN decoded — filled in ${filled.join(', ')}.` : 'VIN decoded, but those fields were already filled in.');
  } catch (err) {
    toast("Couldn't decode that VIN: " + err.message);
  }
}

function newTempId() {
  return 'draft-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

async function checkSession() {
  try { const r = await api('/api/auth'); currentUser = r.username || null; return !!r.ok; } catch { return false; }
}

function renderLogin() {
  topNav.innerHTML = '';
  app.innerHTML = '';
  app.appendChild(document.getElementById('tpl-login').content.cloneNode(true));
  if (window.DEALER && DEALER.name) app.querySelector('.login-wrap h1').textContent = DEALER.name + ' \u2014 dealer login';
  const form = document.getElementById('loginForm');
  const user = document.getElementById('user'), pw = document.getElementById('pw'), remember = document.getElementById('remember');
  const btn = document.getElementById('loginBtn'), err = document.getElementById('loginErr');
  form.addEventListener('submit', async e => {
    e.preventDefault();
    err.hidden = true; btn.disabled = true; btn.textContent = 'Checking…';
    try {
      const r = await api('/api/auth', { method: 'POST', body: JSON.stringify({ username: user.value.trim(), password: pw.value, remember: remember.checked }) });

// Dashboard search box: hides vehicle rows that don't match (rows stay in the page, so nothing is reloaded).
function applyVehicleFilter() {
  const q = ((document.getElementById('vSearch') || {}).value || '').trim().toLowerCase();
  const rows = document.querySelectorAll('#vlist .vrow'); let shown = 0;
  rows.forEach(r => { const hit = !q || q.split(/\s+/).every(w => r.textContent.toLowerCase().includes(w)); r.hidden = !hit; r.style.display = hit ? '' : 'none'; if (hit) shown++; });
  let msg = document.getElementById('vNoMatch');
  if (rows.length && !shown) {
    if (!msg) { msg = document.createElement('div'); msg.id = 'vNoMatch'; msg.className = 'empty-state'; msg.textContent = 'No vehicles match that search.'; document.getElementById('vlist').appendChild(msg); }
  } else if (msg) msg.remove();
}

  async function saveContact() {
    const phone = $('#bPhone').value.trim(), email = $('#bEmail').value.trim();

    try { await api('/api/branding', { method: 'POST', body: JSON.stringify({ phone, email }) }); b.phone = phone; b.email = email; toast('Contact details saved.'); return true; }

  }
  const close = async () => { if (!(await saveContact())) return; overlay.remove(); location.reload(); };     // reload so the new look shows everywhere
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  $('#bClose').addEventListener('click', close);
  async function setColor(c) {
    try { await api('/api/branding', { method: 'POST', body: JSON.stringify({ color: c }) }); b.color = c;
      document.documentElement.style.setProperty('--accent', c || '');
      if (!c) document.documentElement.style.removeProperty('--accent');
      overlay.querySelectorAll('[data-c]').forEach(x => x.style.borderColor = x.dataset.c.toLowerCase() === c.toLowerCase() ? 'var(--text)' : 'transparent');
      toast(c ? 'Colour saved.' : 'Back to the default colour.');
    } catch (e) { toast(e.message); }
  }
  $('#swatches').addEventListener('click', e => { const s = e.target.closest('[data-c]'); if (s) setColor(s.dataset.c); });
  $('#cPick').addEventListener('change', e => setColor(e.target.value));
  $('#cReset').addEventListener('click', () => setColor(''));
  function renderLogo() {
    $('#logoBox').innerHTML = b.logo
      ? `<div style="display:flex;gap:12px;align-items:center"><div style="background:#202429;border-radius:10px;padding:10px 14px"><img src="${esc(b.logo)}" alt="Logo" style="max-height:56px;max-width:220px;display:block"></div>

    $('#lgIn').addEventListener('change', onLogo);
    if (b.logo) $('#lgDel').addEventListener('click', async () => {
      try { await api('/api/branding?logo=1', { method: 'DELETE' }); b.logo = ''; renderLogo(); toast('Logo removed.'); } catch (e) { toast(e.message); }

  }
  async function onLogo(e) {
    const file = e.target.files[0]; e.target.value = ''; if (!file) return;
    try {
      // shrink big logos, keeping a see-through background when the file has one
      const bmp = await createImageBitmap(file);
      const k = Math.min(1, 800 / Math.max(bmp.width, bmp.height));
      const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
      const png = file.type !== 'image/jpeg';
      const blob = await new Promise(ok => c.toBlob(ok, png ? 'image/png' : 'image/jpeg', 0.92));
      const r = await fetch('/api/branding?logo=1', { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: blob });

      if (!r.ok) throw new Error(d.error || 'Upload failed');
      b.logo = d.logo; renderLogo(); toast('Logo saved.');
    } catch (err) { toast('That logo could not be added: ' + err.message); }
  }
  renderLogo();
}

  box.hidden = false;
  box.innerHTML = `<h3 style="font-size:16px;margin:18px 0 8px">Customer requests${d.newCount ? ` <span style="margin-left:6px;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700">${d.newCount} new</span>` : ''}</h3>` +

      <div class="actions"><button class="btn" data-qa="${q.status === 'new' ? 'handled' : 'new'}">${q.status === 'new' ? 'Mark handled' : 'Reopen'}</button><button class="btn danger" data-qa="del">Delete</button></div></div>`).join('');

  };

      <div class="guide-box" id="embedBox">
        <b>Embed code</b>
        <textarea class="input" id="embedCode" rows="3" readonly style="font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px"></textarea>
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn primary" id="embedCopy">Copy embed code</button><button type="button" class="btn" id="linkCopy">Copy link</button><a class="btn" id="embedOpen" target="_blank" rel="noopener">Preview</a></div>
        <div id="embedNote" class="hint"></div>
        <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px"><div id="qrBox" style="width:132px;height:132px;background:#fff;border-radius:8px;overflow:hidden"></div><div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" id="qrDownload">Download QR (SVG)</button><span class="hint" style="margin:0">Opens this vehicle&rsquo;s page.</span></div></div>
      </div>

      <div class="sheet-foot">
        <button class="btn" id="cancelBtn">Cancel</button>
        <button class="btn primary" id="saveBtn">Save vehicle</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  const f = sel => overlay.querySelector(sel);
  f('#fYear').value = vehicle.year; f('#fMake').value = vehicle.make; f('#fModel').value = vehicle.model;
  f('#fTrim').value = vehicle.trim; f('#fStock').value = vehicle.stock; f('#fVin').value = vehicle.vin;
  f('#fOdo').value = vehicle.odometer; f('#fPrice').value = vehicle.price; f('#fNotes').value = vehicle.notes;
  f('#fDrive').value = vehicle.drivetrain || ''; f('#fFuel').value = vehicle.fuel || ''; f('#fEngine').value = vehicle.engine || ''; f('#fTrans').value = vehicle.transmission || '';

  let exterior = [...vehicle.exterior];
  let bodyType = vehicle.bodyType || '';
  let coverUrl = exterior[Number.isInteger(vehicle.coverIndex) ? vehicle.coverIndex : 0] || exterior[0] || null;
  const pendingDelete = [];
  let hotspots = Array.isArray(vehicle.hotspots) ? vehicle.hotspots.slice() : [];
  let panorama = typeof vehicle.panorama === 'string' ? vehicle.panorama : '';
  function renderTypeChips() {
    f('#typeChips').innerHTML = AutoSpinGuide.TYPE_ORDER.map(k => `<button type="button" data-t="${k}" aria-pressed="${k === bodyType}">${AutoSpinGuide.TYPES[k].label}</button>`).join('');
  }
  const applyDecoded = d => { const t = AutoSpinGuide.typeFromDecode(d); if (t && !bodyType) { bodyType = t; renderTypeChips(); } };
  let interiorShots = [...(vehicle.interiorShots || [])];

  function renderExtGrid() {
    const g = f('#extGrid');
    g.innerHTML = exterior.map((url, i) => `
      <div class="ph${url === coverUrl ? ' cover' : ''}" data-i="${i}">
        <img src="${url}" alt="">
        <span class="idx">${i + 1}</span>
        ${url === coverUrl ? '<span class="covertag">Cover</span>' : ''}
        <button type="button" class="cvr" data-cover="${i}" title="${url === coverUrl ? 'This is the inventory cover photo' : 'Set as inventory cover photo'}">${url === coverUrl ? '★' : '☆'}</button>
        <div class="ops">
          <button type="button" data-op="left" title="Move earlier" ${i === 0 ? 'disabled' : ''}>&larr;</button>
          <button type="button" data-op="remove" title="Remove">&times;</button>
          <button type="button" data-op="right" title="Move later" ${i === exterior.length - 1 ? 'disabled' : ''}>&rarr;</button>
        </div>
      </div>`).join('');
  }
  function renderIntGrid() {
    const g = f('#intGrid');
    g.innerHTML = interiorShots.map((url, i) => `
      <div class="ph" data-i="${i}">
        <img src="${url}" alt="">
        <span class="idx">${i + 1}</span>
        <div class="ops">
          <button type="button" data-op="left" title="Move earlier" ${i === 0 ? 'disabled' : ''}>&larr;</button>
          <button type="button" data-op="remove" title="Remove">&times;</button>
          <button type="button" data-op="right" title="Move later" ${i === interiorShots.length - 1 ? 'disabled' : ''}>&rarr;</button>
        </div>
      </div>`).join('');
  }
  renderExtGrid(); renderIntGrid();
  renderTypeChips();
  AdminBg.mount(overlay, { vehicleId: vehicle.id, getExterior: () => exterior, uploadBlob, deletePhoto, toast, ensureSaved: () => autoSave() });
  f('#typeChips').addEventListener('click', e => { const b = e.target.closest('button[data-t]'); if (!b) return; bodyType = b.dataset.t; renderTypeChips(); });
  f('#guidedBtn').addEventListener('click', () => {
    if (exterior.length && !confirm(`This will replace the ${exterior.length} exterior photos already on this vehicle. Continue?`)) return;
    AutoSpinGuide.openGuidedCamera({
      type: bodyType || 'suv',
      onType: t => { bodyType = t; renderTypeChips(); },
      onShot: blob => uploadBlob(vehicle.id, 'exterior', blob),
      onDiscard: url => deletePhoto(url),
      onError: err => toast('A photo failed to upload: ' + err.message),
      onDone: (urls, type) => {
        const good = urls.filter(Boolean);
        if (!good.length) return;
        bodyType = type || bodyType;
        exterior.forEach(u => pendingDelete.push(u));   // old set is removed once you save
        exterior = good; coverUrl = exterior[0] || null; renderExtGrid(); renderTypeChips();
        toast(good.length + ' photos added.');
        autoSave().catch(() => {});
      },
    });
  });
  f('#videoFileBtn').addEventListener('click', () => {
    if (exterior.length && !confirm(`This will replace the ${exterior.length} exterior photos already on this vehicle. Continue?`)) return;
    AS360Frames.open({
      onShot: blob => uploadBlob(vehicle.id, 'exterior', blob),
      onDiscard: url => deletePhoto(url),
      onDone: urls => {
        const good = urls.filter(Boolean); if (!good.length) return;
        exterior.forEach(u => pendingDelete.push(u));
        exterior = good; coverUrl = exterior[0] || null; renderExtGrid();
        toast(good.length + ' frames added.');
        autoSave().catch(() => {});
      },
    });
  });
  f('#guidedIntBtn').addEventListener('click', () => {
    if (interiorShots.length && !confirm(`This will replace the ${interiorShots.length} interior photos already on this vehicle. Continue?`)) return;
    AutoSpinGuide.openGuidedCamera({
      kind: 'interior',
      onShot: blob => uploadBlob(vehicle.id, 'interior', blob),
      onDiscard: url => deletePhoto(url),
      onError: err => toast('A photo failed to upload: ' + err.message),
      onDone: (urls) => {
        const good = urls.filter(Boolean);
        if (!good.length) return;
        interiorShots.forEach(u => pendingDelete.push(u));   // old set is removed once you save
        interiorShots = good; renderIntGrid();
        toast(good.length + ' interior photos added.');
        autoSave().catch(() => {});
      },
    });
  });
  f('#fVin').addEventListener('change', () => {
    const v = f('#fVin').value.trim().toUpperCase();
    if (/^[A-HJ-NPR-Z0-9]{17}$/.test(v)) decodeVin(v, overlay, applyDecoded);
  });

  f('#extGrid').addEventListener('click', async e => {
    const cvr = e.target.closest('button[data-cover]');
    if (cvr) { coverUrl = exterior[+cvr.dataset.cover]; renderExtGrid(); return; }
    const btn = e.target.closest('button[data-op]'); if (!btn) return;
    const i = +btn.closest('.ph').dataset.i;
    if (btn.dataset.op === 'remove') {
      const [gone] = exterior.splice(i, 1); deletePhoto(gone);
      if (gone === coverUrl) coverUrl = exterior[0] || null;
    }
    else if (btn.dataset.op === 'left' && i > 0) { [exterior[i - 1], exterior[i]] = [exterior[i], exterior[i - 1]]; }
    else if (btn.dataset.op === 'right' && i < exterior.length - 1) { [exterior[i + 1], exterior[i]] = [exterior[i], exterior[i + 1]]; }
    renderExtGrid();
  });
  f('#intGrid').addEventListener('click', e => {
    const btn = e.target.closest('button[data-op]'); if (!btn) return;
    const i = +btn.closest('.ph').dataset.i;
    if (btn.dataset.op === 'remove') { const [gone] = interiorShots.splice(i, 1); deletePhoto(gone); }
    else if (btn.dataset.op === 'left' && i > 0) { [interiorShots[i - 1], interiorShots[i]] = [interiorShots[i], interiorShots[i - 1]]; }
    else if (btn.dataset.op === 'right' && i < interiorShots.length - 1) { [interiorShots[i + 1], interiorShots[i]] = [interiorShots[i], interiorShots[i + 1]]; }
    renderIntGrid();
  });

  // the shared VIN scanner (same as Lot Management): barcode + two AI readers, live barcode scan
  f('#scanVinBtn').addEventListener('click', () => VinScan.open({
    current: f('#fVin').value.trim(),
    onVin: v => { f('#fVin').value = v; decodeVin(v, overlay, applyDecoded); },
  }));
  f('#vinPhotoInput').addEventListener('change', async e => {
    const file = e.target.files[0]; e.target.value = '';
    if (file) await scanVinPhoto(overlay, file, foundVin => {
      f('#fVin').value = foundVin;
      decodeVin(foundVin, overlay, applyDecoded);
    });
  });

  /* ---- share & embed ---- */
  (function () {
    const base = location.pathname.replace(/\/admin(\.html)?\/?$/, '');
    const embedUrl = () => location.origin + [base, 'embed', encodeURIComponent(vehicle.id)].join('/');
    const pageUrl = () => location.origin + [base, 'car.html'].join('/') + '?id=' + encodeURIComponent(vehicle.id);
    const title = () => [f('#fYear').value, f('#fMake').value, f('#fModel').value].filter(Boolean).join(' ') || 'Vehicle';
    const code = () => `<iframe src="${embedUrl()}" title="${esc(title())} 360° view" width="100%" height="520" style="border:0;border-radius:12px" loading="lazy" allow="fullscreen; accelerometer; gyroscope" allowfullscreen></iframe>`;
    function refresh() {
      f('#embedCode').value = code();
      f('#embedOpen').href = embedUrl();
      f('#embedNote').textContent = isNew ? 'Save the vehicle first: the embed link works once it is saved.' : 'Anyone can view this embed, so only paste it for vehicles you want public.';
      try { f('#qrBox').innerHTML = AS360QR.svg(pageUrl(), { scale: 4 }).replace(/width="\d+" height="\d+"/, 'width="132" height="132"'); } catch (e) { f('#qrBox').textContent = ''; }
    }
    refresh();
    ['#fYear', '#fMake', '#fModel'].forEach(s => f(s).addEventListener('input', refresh));
    const copy = async (txt, btn, label) => { try { await navigator.clipboard.writeText(txt); } catch (e) { f('#embedCode').select(); document.execCommand && document.execCommand('copy'); } const o = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = label || o; }, 1400); };
    f('#embedCopy').addEventListener('click', e => copy(code(), e.currentTarget, 'Copy embed code'));
    f('#linkCopy').addEventListener('click', e => copy(pageUrl(), e.currentTarget, 'Copy link'));
    f('#qrDownload').addEventListener('click', () => {
      const svg = AS360QR.svg(pageUrl(), { scale: 10 }), a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' })); a.download = (title().replace(/[^a-z0-9]+/gi, '-').toLowerCase() || 'vehicle') + '-qr.svg';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    });
  })();

  /* ---- showroom extras: hotspots + cabin panorama ---- */
  const hsInfo = () => {
    const n = hotspots.length;
    f('#hsInfo').textContent = n ? `${n} pin${n === 1 ? '' : 's'} placed (${hotspots.filter(h => h.kind === 'condition').length} condition notes).` : 'No pins yet. Add pins for features (heated seats, tow package) or honest condition notes (a small ding).';
    f('#panoInfo').textContent = panorama ? 'A cabin panorama is set. Shoppers see it under Interior.' : 'Upload one equirectangular (2:1) photo from a 360 camera. Normal wide photos are rejected so nobody sees a distorted view.';
    f('#panoRm').hidden = !panorama; f('#panoBtn').textContent = panorama ? 'Replace panorama' : 'Upload panorama';
  };
  hsInfo();
  f('#hsBtn').addEventListener('click', () => {
    if (!window.AS360Showroom) { toast('The hotspot editor did not load. Refresh the page and try again.'); return; }
    AS360Showroom.openEditor({
      hotspots, exterior, interior: interiorShots, panorama,
      uploadPhoto: async file => {
        if (!/^image\//.test(file.type)) throw new Error('Choose a photo.');
        return uploadBlob(vehicle.id, 'interior', file);
      },
      onDropPhoto: url => pendingDelete.push(url),
      onSave: async list => { hotspots = list; hsInfo(); if (!isNew || exterior.length || interiorShots.length) await autoSave(); toast('Hotspots saved.'); },
    });
  });
  f('#panoBtn').addEventListener('click', () => f('#panoFile').click());
  f('#panoRm').addEventListener('click', async () => {
    if (!confirm('Remove the cabin panorama? Pins placed on it will be removed too.')) return;
    if (panorama) pendingDelete.push(panorama);
    panorama = ''; hotspots = hotspots.filter(h => h.view !== 'pano'); hsInfo();
    try { await autoSave(); toast('Panorama removed.'); } catch (e) {}
  });
  f('#panoFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = ''; if (!file) return;
    const btn = f('#panoBtn'); btn.disabled = true; btn.textContent = 'Checking photo…';
    try {
      const bmp = await createImageBitmap(file), r = bmp.width / bmp.height;
      if (r < 1.9 || r > 2.1) { bmp.close && bmp.close(); throw new Error('That photo is not 2:1 (it is ' + bmp.width + '×' + bmp.height + '). A 360° panorama must be exactly twice as wide as it is tall, as exported by a 360 camera.'); }
      const k = Math.min(1, 8192 / bmp.width), c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
      const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
      const blob = await new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.88));
      if (!blob) throw new Error('Could not prepare the photo.');
      btn.textContent = 'Uploading…';
      const rr = await fetch(`/api/upload?vehicleId=${encodeURIComponent(vehicle.id)}&kind=interior&pano=1`, { method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: blob });
      const d = await rr.json().catch(() => ({})); if (!rr.ok) throw new Error(d.error || 'Upload failed');
      if (panorama) pendingDelete.push(panorama);
      panorama = d.url; hsInfo();
      if (!isNew || exterior.length || interiorShots.length) await autoSave();
      toast('Panorama added. Shoppers will see it under Interior.');
    } catch (er) { toast(er.message); }
    finally { btn.disabled = false; hsInfo(); }
  });

  f('#cancelBtn').addEventListener('click', () => overlay.remove());
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });

  let saving = null;   // an auto-save in flight
  async function saveVehicle() {
    const payload = {
      id: vehicle.id, year: f('#fYear').value.trim(), make: f('#fMake').value.trim(), model: f('#fModel').value.trim(),
      trim: f('#fTrim').value.trim(), stock: f('#fStock').value.trim(), vin: f('#fVin').value.trim(),
      odometer: f('#fOdo').value.trim(), price: f('#fPrice').value.trim(), notes: f('#fNotes').value.trim(),
      drivetrain: f('#fDrive').value.trim(), fuel: f('#fFuel').value.trim(), engine: f('#fEngine').value.trim(), transmission: f('#fTrans').value.trim(),
      exterior, interiorShots, bodyType, hotspots, panorama,
      coverIndex: Math.max(0, exterior.indexOf(coverUrl)),
    };
    if (isNew) { await api('/api/vehicles', { method: 'POST', body: JSON.stringify(payload) }); isNew = false; }
    else await api('/api/vehicle?id=' + encodeURIComponent(vehicle.id), { method: 'PUT', body: JSON.stringify(payload) });
  }
  // Saves quietly as soon as there are photos (and before a background is applied), so a closed
  // editor, a reload or a crashed tab never loses a vehicle whose photos are already uploaded.
  async function autoSave() {
    if (!exterior.length && !interiorShots.length) return;
    if (saving) { await saving.catch(() => {}); }
    saving = saveVehicle();
    try { await saving; loadList(); }
    catch (e) { toast('Auto-save failed: ' + e.message + ' — tap Save vehicle to try again.'); throw e; }
    finally { saving = null; }
  }

  f('#saveBtn').addEventListener('click', async () => {
    const saveBtn = f('#saveBtn'); saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    try {
      if (saving) await saving.catch(() => {});
      await saveVehicle();
      overlay.remove(); toast('Saved.'); loadList();
      pendingDelete.forEach(u => deletePhoto(u));
    } catch (e) {
      toast(e.message); saveBtn.disabled = false; saveBtn.textContent = 'Save vehicle';
    }
  });
}

(async () => { (await checkSession()) ? renderManager() : renderLogin(); })();
</script>
</body>
</html>
