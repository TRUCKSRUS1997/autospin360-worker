<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vehicle</title>
<link rel="manifest" href="/site.webmanifest">
<link rel="apple-touch-icon" href="/api/icon?size=192">
<link rel="icon" href="/api/icon?size=192" sizes="192x192">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AutoSpin360">
<meta name="theme-color" content="#0a0b0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/viewer.css?v=spin2">
<script src="/inv-core.js"></script>
<style>
body{overflow-x:hidden}
.crumb{display:inline-flex; align-items:center; gap:8px; margin:0 0 18px; padding:8px 14px 8px 10px; border-radius:999px; border:1px solid var(--line); background:rgba(255,255,255,.03); color:var(--muted); font-size:13px; font-weight:500; text-decoration:none; transition:color .2s,border-color .2s,background .2s}
.crumb:hover{color:var(--text); border-color:var(--line2); background:rgba(255,255,255,.06)}
.crumb svg{width:16px; height:16px}
.titlebar{display:flex; align-items:flex-end; justify-content:space-between; gap:20px; margin-bottom:24px}
.titlebar .eyebrow{margin-bottom:8px}
#title{font-size:clamp(26px,4vw,44px); font-weight:700; letter-spacing:-.035em; line-height:1.05; margin:0}
.stockchip2{display:inline-flex; align-items:center; gap:8px; margin:12px 0 0; padding:5px 12px; border-radius:999px; border:1px solid var(--line2); background:var(--panel); font-size:12.5px; font-weight:500; letter-spacing:.03em; color:var(--muted)}
.stockchip2:empty{display:none}
.share-btn{flex:none}
.share-btn svg{width:17px; height:17px}

.vd{display:grid; grid-template-columns:minmax(0,1fr) 372px; gap:32px; align-items:start}
.stage-wrap{height:min(74vh,720px); min-height:360px}
.photo-mode{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:0 0 14px}
.photo-mode .seg2{display:inline-flex; background:var(--panel); border:1px solid var(--line2); border-radius:14px; padding:4px}
.photo-mode .seg2 button{border:0; background:transparent; color:var(--muted); font:600 13px var(--font-body); letter-spacing:.01em; padding:9px 16px; border-radius:10px; cursor:pointer; transition:background .25s,color .25s}
.photo-mode .seg2 button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 32%,transparent)}
.photo-mode .seg2 button:disabled{opacity:.45; cursor:default}
.photo-mode small{color:var(--muted); font-size:12.5px; line-height:1.4; flex:1; min-width:200px}

.vd-side{position:sticky; top:88px; display:flex; flex-direction:column; gap:16px}
.pricebox{padding:22px 24px; border-radius:var(--r-lg); background:linear-gradient(160deg,color-mix(in srgb,var(--accent) 14%,var(--panel2)),var(--panel) 70%); border:1px solid color-mix(in srgb,var(--accent) 28%,var(--line)); box-shadow:var(--shadow-1)}
.pricebox span{display:block; font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:6px}
.pricebox b{display:block; font:700 clamp(30px,3.4vw,40px)/1.05 var(--font-display); letter-spacing:-.035em}
.specs{display:flex; flex-direction:column; border-radius:var(--r-lg); background:var(--panel); border:1px solid var(--line); overflow:hidden}
.specs:empty{display:none}
.specs>div{display:flex; align-items:center; justify-content:space-between; gap:16px; padding:15px 20px; border-bottom:1px solid var(--line)}
.specs>div:last-child{border-bottom:0}
.specs>div span{font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); flex:none}
.specs>div b{font-size:15px; font-weight:600; text-align:right; word-break:break-all; display:inline-flex; align-items:center; gap:10px}
.specs .copy{border:1px solid var(--line2); background:var(--panel2); color:var(--muted); border-radius:8px; width:30px; height:30px; display:grid; place-items:center; cursor:pointer; padding:0; flex:none; transition:color .2s,border-color .2s}
.specs .copy:hover{color:var(--text); border-color:var(--muted)}
.specs .copy svg{width:15px; height:15px}
.specs .vin{font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13.5px; letter-spacing:.02em}
.notes-card{padding:20px 22px; border-radius:var(--r-lg); background:var(--panel); border:1px solid var(--line)}
.notes-card h3{font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin:0 0 10px; font-family:var(--font-body)}
.notes{white-space:pre-wrap; color:#cfd2d8; line-height:1.65; margin:0; font-size:15px}
.tip360{display:flex; gap:12px; align-items:flex-start; padding:14px 16px; border-radius:var(--r-md); border:1px dashed var(--line2); color:var(--muted); font-size:13px; line-height:1.5}
.tip360 svg{width:20px; height:20px; flex:none; color:var(--accent); margin-top:1px}

.cta-row{display:grid; gap:10px; margin-top:18px}
.cta-row .btn{width:100%; min-height:50px; font-size:15px}
.cta-row .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.price-top{display:none; margin:14px 0 0; font:700 30px/1 var(--font-display); letter-spacing:-.035em}
.chip-body{display:inline-flex; margin:12px 0 0 8px; padding:5px 12px; border-radius:999px; border:1px solid var(--line2); background:var(--panel); font-size:12.5px; font-weight:500; letter-spacing:.03em; color:var(--muted)}
.chip-body:empty{display:none}
.similar{margin-top:56px}
.similar h2{font-size:clamp(22px,2.6vw,30px); letter-spacing:-.03em; margin:0 0 20px}
.similar .grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.vtabs{display:flex; gap:6px; overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none; padding:2px 0 4px}
.vtabs::-webkit-scrollbar{display:none}
.vtabs button{flex:none; min-height:46px; padding:0 18px; border-radius:999px; border:1px solid var(--line2); background:var(--panel); color:var(--ink); font:600 14px var(--font-body); cursor:pointer; white-space:nowrap}
.vtabs button[aria-selected=true]{background:var(--accent); color:var(--accent-ink,#1a1400); border-color:transparent}
.vpanel{padding:4px 0 8px}
.fav-btn[aria-pressed=true] svg{fill:var(--accent); color:var(--accent)}
.mbar{display:none}
@media print{.topbar,.home-fab,.mbar,.share-btn,.cta-row,.similar,.photo-mode,.tip360,.crumb{display:none!important} body{background:#fff!important;color:#000!important} .vd{display:block}}
@media (max-width:1020px){
  .vd{grid-template-columns:1fr; gap:22px}
  .price-top{display:block}
  .vd-side{position:static}
}
@media (max-width:640px){
  .titlebar{align-items:flex-start; flex-direction:row; gap:12px}
  .titlebar > div{min-width:0; flex:1}
  .share-btn{flex:none; align-self:flex-start; width:48px; min-height:48px; padding:0; justify-content:center}
  .share-btn #shareLbl{display:none}
  .crumb{display:none!important}
  .vd-main{display:flex; flex-direction:column; gap:14px}
  .vd-main .photo-mode{order:2}
  .stage-wrap{order:1}
  body .home-fab{display:none!important}
  .mbar{display:flex; position:fixed; left:0; right:0; bottom:0; z-index:70; align-items:center; gap:12px; padding:10px max(14px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); background:var(--glass); -webkit-backdrop-filter:saturate(1.4) blur(18px); backdrop-filter:saturate(1.4) blur(18px); border-top:1px solid var(--glass-line)}
  .mbar .p{flex:1; min-width:0; font:700 20px/1.1 var(--font-display); letter-spacing:-.03em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .mbar .p small{display:block; font:500 11.5px var(--font-body); letter-spacing:.02em; color:var(--muted); margin-bottom:2px}
  .mbar .btn{flex:none; min-height:46px; padding:0 20px}
  .wrap{padding-bottom:calc(120px + env(safe-area-inset-bottom))!important}
  .stage-wrap{height:min(58vh,520px); min-height:320px}
  .photo-mode small{min-width:0; flex-basis:100%}
  .pricebox{padding:18px 20px}
}
</style>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><circle cx="16" cy="16" r="12" stroke="currentColor" stroke-width="1.6" opacity=".3"/><g class="arc"><path d="M16 4a12 12 0 0 1 12 12" stroke="var(--accent)" stroke-width="2.6" stroke-linecap="round"/><circle cx="28" cy="16" r="2.3" fill="var(--accent)"/></g><path d="M9.2 19.2l1.2-3.4a1.7 1.7 0 0 1 1.6-1.1h8a1.7 1.7 0 0 1 1.6 1.1l1.2 3.4v2.3H9.2z" fill="currentColor"/></svg>AutoSpin<span>360</span></a>
  <nav><a href="/">All vehicles</a></nav>
</header>
<main class="wrap">
  <div id="state" class="loader"><span class="spin"></span> Loading vehicle&hellip;</div>
  <div id="content" hidden>
    <a class="crumb" href="/"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span id="crumbName">Inventory</span></a>
    <div class="titlebar">
      <div>
        <p class="eyebrow" id="eyebrow" hidden></p>
        <h1 id="title"></h1>
        <p style="margin:0"><span class="stockchip2" id="stockLine"></span><span class="chip-body" id="bodyChip"></span></p>
        <div class="price-top" id="priceTop" hidden></div>
      </div>
      <button type="button" class="btn share-btn fav-btn" id="favBtn" aria-pressed="false" aria-label="Save this vehicle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2z"/></svg><span id="favLbl">Save</span></button>
      <button type="button" class="btn share-btn" id="shareBtn" aria-label="Share this vehicle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
        <span id="shareLbl">Share</span>
      </button>
    </div>
    <div class="vd">
      <section class="vd-main">
        <div class="vtabs" id="vtabs" role="tablist" aria-label="Vehicle views" hidden></div>
        <div class="photo-mode" id="photoMode" hidden>
          <div class="seg2" role="group" aria-label="Photo mode">
            <button type="button" data-mode="enh" aria-pressed="false" disabled>Enhanced</button>
            <button type="button" data-mode="orig" aria-pressed="true">Original</button>
          </div>
          <small id="modeNote">Preparing enhanced view&hellip;</small>
        </div>
        <div class="stage-wrap"><div id="stage" class="viewer-shell"></div></div>
        <div id="vpanel" class="vpanel" hidden></div>
      </section>
      <aside class="vd-side">
        <div class="pricebox" id="priceBox"><span>Price</span><b id="priceLine">Contact for price</b><div class="cta-row" id="ctaRow"></div></div>
        <div id="payCalc"></div>
        <div class="specs" id="specs"></div>
        <div class="notes-card" id="notesCard" hidden><h3>About this vehicle</h3><p class="notes" id="notes" hidden></p></div>
        <div class="tip360"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg><span>Drag the vehicle to spin it around, switch to <b>Interior</b> for the cabin, and use the magnifier to zoom in on any detail.</span></div>
      </aside>
    </div>
    <section class="similar" id="similar" hidden><h2>More like this</h2><div class="grid" id="similarGrid"></div></section>
  </div>
</main>
<div class="mbar" id="mbar" hidden><div class="p" id="mbarPrice"></div><span id="mbarCta"></span></div>
<script src="/home-btn.js"></script>
<script src="/viewer.js?v=spin2"></script>
<script src="/showroom.js?v=1"></script>
<script src="/inquiry.js?v=1" defer></script>
<script src="/calc.js?v=1" defer></script>
<script src="/compare.js?v=1" defer></script>
<script src="/tour.js?v=1"></script>
<script src="/photo-tools.js"></script>
<script>
(async () => {
  const PT = window.PhotoTools;
  const id = new URLSearchParams(location.search).get('id');
  const stateEl = document.getElementById('state');
  if (!id) { stateEl.innerHTML = '<div class="empty-state">No vehicle specified.</div>'; return; }
  let v, bg = {};
  try {
    const [r, rb] = await Promise.all([
      fetch('/api/vehicle?id=' + encodeURIComponent(id)),
      fetch('/api/background?id=' + encodeURIComponent(id)).catch(() => null),
    ]);
    if (!r.ok) throw new Error('not found');
    v = await r.json();
    if (rb && rb.ok) bg = await rb.json().catch(() => ({}));
  } catch (e) {
    stateEl.innerHTML = '<div class="empty-state">That vehicle could not be found.</div>';
    return;
  }
  async function loadSimilar() {
    try {
      const r = await fetch('/api/vehicles'); if (!r.ok) return;
      const all = (await r.json()).filter(x => x && x.id && x.id !== id).map((x, n) => I.normalize(x, n));
      const score = x => (x.make && x.make === N.make ? 2 : 0) + (x.body && x.body === N.body ? 1 : 0);
      const pick = all.filter(x => score(x) > 0).sort((a, b) => score(b) - score(a) || a.n - b.n).slice(0, 3);
      if (!pick.length) return;
      document.getElementById('similarGrid').innerHTML = pick.map((x, i) => I.cardHTML(x, i + 2)).join('');
      document.getElementById('similar').hidden = false;
    } catch (e) {}
  }
  const esc = s => String(s || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  document.title = [v.year, v.make, v.model].filter(Boolean).join(' ') || 'Vehicle';
  document.getElementById('title').textContent = [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ') || 'Vehicle';
  document.getElementById('stockLine').textContent = v.stock ? ('Stock #' + v.stock) : '';
  const eyebrow = [v.year, v.make].filter(Boolean).join(' · ');
  if (eyebrow) { const e = document.getElementById('eyebrow'); e.textContent = eyebrow; e.hidden = false; }
  if (window.DEALER && DEALER.name) document.getElementById('crumbName').textContent = DEALER.name + ' inventory';
  const I = window.AS360Inv, N = I.normalize(v, 0), D = window.DEALER || {};
  const priceTxt = I.fmtPrice(N) || 'Contact for price';
  document.getElementById('priceLine').textContent = priceTxt;
  const mountCalc = () => { if (window.AS360Calc && N.price > 0) AS360Calc.mount(document.getElementById('payCalc'), { price: N.price }); else if (N.price > 0) setTimeout(mountCalc, 150); };
  mountCalc();
  if (I.fmtPrice(N)) { const pt = document.getElementById('priceTop'); pt.textContent = priceTxt; pt.hidden = false; }
  document.getElementById('bodyChip').textContent = I.BODY[N.body] || '';
  const titleTxt = [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ') || 'Vehicle';
  // Calls to action: calling and emailing appear once the dealership has added a phone number / email under Branding.
  const pageUrl = location.origin + '/car.html?id=' + encodeURIComponent(id);
  const mail = D.email ? `mailto:${encodeURIComponent(D.email).replace(/%40/g, '@')}?subject=${encodeURIComponent('Question about ' + titleTxt + (v.stock ? ' (Stock #' + v.stock + ')' : ''))}&body=${encodeURIComponent('Hi, I\u2019m interested in this vehicle:\n' + titleTxt + (v.vin ? '\nVIN ' + v.vin : '') + '\n' + pageUrl)}` : '';
  const tel = D.phone ? 'tel:' + String(D.phone).replace(/[^0-9+]/g, '') : '';
  const CALL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg>';
  const MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>';
  const cta = document.getElementById('ctaRow');
  const ctaBtns = [];
  if (tel) ctaBtns.push(`<a class="btn primary" href="${esc(tel)}">${CALL}Call ${esc(D.phone)}</a>`);
  if (mail) ctaBtns.push(`<a class="btn${tel ? '' : ' primary'}" href="${esc(mail)}">${MAIL}Email about this vehicle</a>`);
  if (!ctaBtns.length) ctaBtns.push('<button type="button" class="btn primary" id="ctaShare">Share this vehicle</button>');
  ctaBtns.unshift('<button type="button" class="btn primary" data-inq="test-drive">Book a test drive</button>');
  ctaBtns.push('<button type="button" class="btn" data-cmpadd>Compare with other vehicles</button>');
  ctaBtns.push('<button type="button" class="btn" data-inq="info">Ask a question</button>', '<button type="button" class="btn" data-inq="trade-in">Trade-in request</button>');
  ctaBtns.push('<button type="button" class="btn" id="ctaPrint">Print / save as PDF</button>');
  cta.innerHTML = ctaBtns.join('');
  document.getElementById('ctaPrint').addEventListener('click', () => window.print());
  cta.querySelectorAll('[data-cmpadd]').forEach(b => b.addEventListener('click', () => { const C = window.AS360Compare; if (!C) return; C.add(id); if (C.ids().length >= 2) C.open(); else { b.textContent = 'Added. Pick another from More like this or the inventory'; } }));
  cta.querySelectorAll('[data-inq]').forEach(b => b.addEventListener('click', () => window.AS360Inquiry && window.AS360Inquiry.open({ id, title: titleTxt }, b.dataset.inq)));
  const mb = document.getElementById('mbar');
  document.getElementById('mbarPrice').innerHTML = `<small>${esc(N.stock ? 'Stock #' + N.stock : 'Price')}</small>${esc(priceTxt)}`;
  document.getElementById('mbarCta').innerHTML = tel ? `<a class="btn primary" href="${esc(tel)}">${CALL}Call</a>` : (mail ? `<a class="btn primary" href="${esc(mail)}">${MAIL}Email</a>` : '<button type="button" class="btn primary" id="mbarShare">Share</button>');
  mb.hidden = false;
  const specs = [];
  if (v.year) specs.push(['Year', v.year]);
  if (v.make) specs.push(['Make', v.make]);
  if (v.model) specs.push(['Model', v.model]);
  if (v.trim) specs.push(['Trim', v.trim]);
  if (I.BODY[N.body]) specs.push(['Body style', I.BODY[N.body]]);
  if (v.odometer) specs.push(['Odometer', I.fmtOdo(N) || v.odometer]);
  if (v.engine) specs.push(['Engine', v.engine]);
  if (v.transmission) specs.push(['Transmission', v.transmission]);
  if (v.drivetrain) specs.push(['Drivetrain', v.drivetrain]);
  if (v.fuel) specs.push(['Fuel', v.fuel]);
  if (v.stock) specs.push(['Stock #', v.stock]);
  if (v.vin) specs.push(['VIN', v.vin, true]);
  const COPY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>';
  const specsEl = document.getElementById('specs');
  specsEl.innerHTML = specs.map(([k, val, isVin]) => `<div><span>${esc(k)}</span><b${isVin ? ' class="vin"' : ''}>${esc(val)}${isVin ? `<button type="button" class="copy" data-copy="${esc(val)}" aria-label="Copy VIN" title="Copy VIN">${COPY}</button>` : ''}</b></div>`).join('');
  specsEl.addEventListener('click', async e => {
    const b = e.target.closest('button[data-copy]'); if (!b) return;
    try { await navigator.clipboard.writeText(b.dataset.copy); b.style.color = 'var(--ok)'; setTimeout(() => { b.style.color = ''; }, 1400); } catch (err) {}
  });
  if (v.notes) { const n = document.getElementById('notes'); n.textContent = v.notes; n.hidden = false; document.getElementById('notesCard').hidden = false; }

  const extUrls = (v.exterior || []).filter(Boolean), intUrls = (v.interiorShots || []).filter(Boolean);
  const hasPhotos = extUrls.length >= 2;
  // Dealer-chosen background: finished frames (plain + enhanced) were made in the admin, so they
  // load instantly. Only used while they still match every current exterior photo.
  const map = bg && bg.style && bg.map || null;
  const bgOn = !!(map && hasPhotos && extUrls.every(u => map[u] && map[u].plain && map[u].enh));

  let ext;
  const int = await PT.prepare(intUrls, true);
  if (bgOn) ext = null;
  else ext = await PT.prepare(extUrls, true);
  const sets = {
    orig: { exterior: bgOn ? extUrls.map(u => map[u].plain) : ext.orig, interiorShots: int.orig },
    enh: null,
  };

  stateEl.hidden = true;
  document.getElementById('content').hidden = false;
  let stageRef = document.getElementById('stage');
  let mode = 'orig', viewer = null, showroom = null;
  const mountMode = m => {
    if (showroom && showroom.destroy) showroom.destroy();
    if (viewer && viewer.destroy) viewer.destroy();
    const fresh = stageRef.cloneNode(false); stageRef.replaceWith(fresh);   // drop old listeners
    stageRef = fresh;
    viewer = VehicleViewer.mount(fresh, Object.assign({}, v, sets[m]));
    showroom = window.AS360Showroom ? AS360Showroom.attach(viewer, v) : null;
  };
  viewer = VehicleViewer.mount(stageRef, Object.assign({}, v, sets.orig));
  showroom = window.AS360Showroom ? AS360Showroom.attach(viewer, v) : null;

  // Share: native share sheet on phones, copy-link fallback elsewhere.
  const shareBtn = document.getElementById('shareBtn'), shareLbl = document.getElementById('shareLbl');
  const flash = txt => { shareLbl.textContent = txt; setTimeout(() => { shareLbl.textContent = 'Share'; }, 2200); };
  const doShare = async () => {
    const title = [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ') || 'Vehicle';
    const url = location.origin + '/car.html?id=' + encodeURIComponent(id);
    const text = title + (v.stock ? ' (Stock #' + v.stock + ')' : '') + ' — spin it around in 360°';
    if (navigator.share) {
      try { await navigator.share({ title, text, url }); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    try { await navigator.clipboard.writeText(url); flash('Link copied'); }
    catch (e) { window.prompt('Copy this link:', url); }
  };
  shareBtn.addEventListener('click', doShare);
  ['ctaShare', 'mbarShare'].forEach(i => { const el = document.getElementById(i); if (el) el.addEventListener('click', doShare); });

  // Enhanced view: built in the background (or ready-made with a dealer background), switches on when ready.
  const modeBox = document.getElementById('photoMode'), note = document.getElementById('modeNote');
  const btns = modeBox.querySelectorAll('button');
  const bgNote = bgOn ? ' Background digitally replaced; the vehicle is as photographed.' : '';
  const setMode = m => {
    if (m === mode || !sets[m]) return;
    mode = m; btns.forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === m ? 'true' : 'false'));
    note.textContent = (m === 'enh' ? 'Glare and haze reduced. Tone only, no pixels moved or retouched.' : 'Untouched photos, exactly as taken.') + bgNote;
    mountMode(m);
  };
  btns.forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); pref('mode', b.dataset.mode); }));

  /* ---- view tabs: only the views this vehicle really has ---- */
  const T = window.AS360Tour, tabsEl = document.getElementById('vtabs'), panel = document.getElementById('vpanel');
  const stageWrap = document.querySelector('.stage-wrap'), photoBox = document.getElementById('photoMode');
  const pref = (k, val) => { try { if (val === undefined) return localStorage.getItem('as360.' + k); localStorage.setItem('as360.' + k, val); } catch (e) {} return null; };
  (function setupTabs() {
    if (!T) return;
    const c = T.counts(v), hasInt = !!(intUrls.length || (typeof v.panorama === 'string' && v.panorama));
    const defs = [{ id: 'ext', label: 'Exterior 360°' }];
    if (c.views || hasInt) defs.push({ id: 'int', label: 'Interior' });
    if (c.videos) defs.push({ id: 'vid', label: 'Videos' });
    if (c.inspection) defs.push({ id: 'insp', label: 'Inspection' });
    if (c.details) defs.push({ id: 'det', label: 'Details' });
    if (defs.length < 2) return;
    tabsEl.hidden = false; let active = null, comp = null;
    const photoWas = () => photoBox.dataset.was;
    function select(id, focus) {
      if (comp) { comp.destroy(); comp = null; } panel.innerHTML = ''; panel.hidden = true;
      const showStage = id === 'ext' || (id === 'int' && !c.views);
      stageWrap.hidden = !showStage; if (photoBox) photoBox.style.display = id === 'ext' ? '' : 'none';
      if (id === 'ext' || id === 'int') { if (viewer && viewer.setView && showStage) { try { viewer.setView(id === 'int' ? 'int' : 'ext'); } catch (e) {} } }
      if (id === 'int' && c.views) { panel.hidden = false; comp = T.interior(panel, v); }
      if (id === 'vid') { panel.hidden = false; comp = T.videos(panel, v); }
      if (id === 'insp') { panel.hidden = false; comp = T.inspection(panel, v); }
      if (id === 'det') { panel.hidden = false; comp = T.details(panel, v); }
      active = id; tabsEl.querySelectorAll('button').forEach(b => { const on = b.dataset.id === id; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; if (on && focus) b.focus(); });
      pref('tab', id);
    }
    defs.forEach(d => { const b = document.createElement('button'); b.type = 'button'; b.setAttribute('role', 'tab'); b.dataset.id = d.id; b.textContent = d.label; b.addEventListener('click', () => select(d.id)); tabsEl.appendChild(b); });
    tabsEl.addEventListener('keydown', e => { const ids = defs.map(d => d.id), i = ids.indexOf(active); if (e.key === 'ArrowRight') { select(ids[(i + 1) % ids.length], true); e.preventDefault(); } else if (e.key === 'ArrowLeft') { select(ids[(i - 1 + ids.length) % ids.length], true); e.preventDefault(); } });
    const hash = (location.hash || '').replace('#', ''), want = defs.find(d => d.id === hash);
    select(want ? want.id : 'ext');
    window.AS360Tabs = { select, ids: defs.map(d => d.id) };
  })();
  // saved vehicles (kept in this browser only)
  (function favs() {
    const b = document.getElementById('favBtn'), lbl = document.getElementById('favLbl'); if (!b) return;
    const read = () => { try { return JSON.parse(localStorage.getItem('as360.favs') || '[]'); } catch (e) { return []; } };
    const paint = () => { const on = read().includes(id); b.setAttribute('aria-pressed', String(on)); lbl.textContent = on ? 'Saved' : 'Save'; b.setAttribute('aria-label', on ? 'Remove from saved vehicles' : 'Save this vehicle'); };
    b.addEventListener('click', () => { let a = read(); a = a.includes(id) ? a.filter(x => x !== id) : [id, ...a].slice(0, 100); try { localStorage.setItem('as360.favs', JSON.stringify(a)); } catch (e) {} paint(); });
    paint();
  })();
  loadSimilar();
  if (hasPhotos) {
    modeBox.hidden = false;
    const total = (bgOn ? 0 : ext.items.filter(Boolean).length) + int.items.filter(Boolean).length; let done = 0;
    const step = () => { done++; note.textContent = `Preparing enhanced view… ${Math.round(done / Math.max(1, total) * 100)}%`; };
    if (bgOn) note.textContent = 'Preparing enhanced view…' + bgNote;
    try {
      const enhExt = bgOn ? extUrls.map(u => map[u].enh) : await PT.enhanceSet(ext, step);
      const enhInt = await PT.enhanceSet(int, step);
      sets.enh = { exterior: enhExt, interiorShots: enhInt };
      modeBox.querySelector('[data-mode="enh"]').disabled = false;
      if (pref('mode') !== 'orig') setMode('enh');
    } catch (e) {
      note.textContent = 'Enhanced view isn’t available for these photos.' + bgNote;
    }
  }
})();
</script>
</body>
</html>
