<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>360° view</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/viewer.css">
<style>
html,body{margin:0;height:100%;background:var(--bg,#0a0b0d);color:var(--text,#f3f4f6);overflow:hidden}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
#bar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:44px;background:var(--panel,#14161a);border-bottom:1px solid var(--line,#252930);font:600 14px/1.2 system-ui,sans-serif}
#bar b{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar a{flex:none;color:var(--accent,#f2b705);text-decoration:none;font-weight:700;padding:10px 4px}
#bar a:focus-visible{outline:2px solid var(--accent,#f2b705);outline-offset:2px;border-radius:4px}
#stage{flex:1;min-height:0;position:relative}
#msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted,#9aa1ab);font:15px system-ui,sans-serif;padding:20px;text-align:center}
</style>
</head>
<body>
<div id="wrap">
  <div id="bar"><b id="t">Loading…</b><a id="full" href="#" target="_top" rel="noopener">View details</a></div>
  <div id="stage" class="viewer-shell"><div id="msg">Loading 360° view…</div></div>
</div>
<script src="/viewer.js?v=spin2"></script>
<script src="/showroom.js?v=1"></script>
<script src="/photo-tools.js"></script>
<script>
(async () => {
  const id = (location.pathname.match(/\/embed\/([A-Za-z0-9_-]+)/) || [])[1] || '';
  const msg = document.getElementById('msg'), stage = document.getElementById('stage');
  const fail = t => { msg.textContent = t; };
  if (!id) return fail('No vehicle specified.');
  let v;
  try { const r = await fetch('/api/vehicle?id=' + encodeURIComponent(id)); if (!r.ok) throw 0; v = await r.json(); } catch (e) { return fail('This vehicle could not be found.'); }
  const title = [v.year, v.make, v.model, v.trim].filter(Boolean).join(' ') || 'Vehicle';
  document.title = title + ' · 360° view';
  document.getElementById('t').textContent = title;
  // the link goes to the dealership's own page for this car (same site as this frame)
  const base = location.pathname.replace(/\/embed\/[^/]*\/?$/, '');
  document.getElementById('full').href = base + '/car.html?id=' + encodeURIComponent(id);
  const ext = (v.exterior || []).filter(Boolean), int = (v.interiorShots || []).filter(Boolean);
  if (!ext.length) return fail('No photos yet.');
  const PT = window.PhotoTools;
  let sets = { exterior: ext, interiorShots: int };
  try { const [a, b] = await Promise.all([PT.prepare(ext, true), PT.prepare(int, true)]); sets = { exterior: a.orig, interiorShots: b.orig }; } catch (e) { /* use the originals */ }
  msg.remove();
  const viewer = VehicleViewer.mount(stage, Object.assign({}, v, sets));
  if (window.AS360Showroom) AS360Showroom.attach(viewer, v);
})();
</script>
</body>
</html>
