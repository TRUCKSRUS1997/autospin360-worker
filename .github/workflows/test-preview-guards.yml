name: Preview guard tests

on:
  push:
    branches:
      - fix/preview-deploy-guards
  pull_request:
    branches:
      - stage-0-test-harness
    paths:
      - ".github/workflows/test-preview-guards.yml"
      - "scripts/deploy_preview.py"
      - "tests/test_preview_guards.py"
      - "requirements-test.txt"

permissions:
  contents: read

jobs:
  preview-guard-unit-tests:
    name: Preview guard unit tests (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test requirements
        run: python -m pip install -r requirements-test.txt
      - name: Run preview guard unit tests
        run: |
          python -c "import sys; sys.path.insert(0, 'tests'); import test_preview_guards as t; results=t.run(); [print(('PASS  ' if ok else 'FAIL  ') + name + ('' if ok or not detail else ': ' + detail)) for name, ok, detail in results]; failed=sum(not ok for _, ok, _ in results); print(f'\\n{len(results)-failed} passed, {failed} failed'); raise SystemExit(1 if failed else 0)"
