name: Test and preview

# Runs on development branches (stage-*, preview/*) and on pull requests. It never touches production.
#
#  1. Test     - always. Local checks and headless-browser checks with generated data. No secrets, no network to Cloudflare.
#  2. Preview  - only when the repository variable PREVIEW_DEPLOY_READY is "true". Publishes this branch's site/ files to the
#                "autospin360-preview" Worker in a SEPARATE Cloudflare account (its own empty test bucket), seeds one generated
#                test vehicle, and re-runs the browser checks against it.
#                Credentials: the preview account's own token, plus a read-only token that can only download the production
#                Worker's code. The production deploy token (CF_API_TOKEN) is never used here. Nothing in the production
#                account can be written from this workflow.
on:
  push:
    branches: ["stage-*", "preview/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/run_all.py

  preview:
    name: Preview Worker (isolated)
    needs: test
    if: >-
      vars.PREVIEW_DEPLOY_READY == 'true' &&
      github.event_name != 'pull_request' &&
      (startsWith(github.ref_name, 'stage-') || startsWith(github.ref_name, 'preview/')) &&
      github.repository == 'TRUCKSRUS1997/autospin360-worker'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Publish the preview
        id: pub
        env:
          PREVIEW_CF_API_TOKEN: ${{ secrets.PREVIEW_CF_API_TOKEN }}
          PREVIEW_CF_ACCOUNT_ID: ${{ secrets.PREVIEW_CF_ACCOUNT_ID }}
          PROD_CODE_READ_TOKEN: ${{ secrets.PROD_CODE_READ_TOKEN }}
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
          PREVIEW_OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
        run: python scripts/deploy_preview.py deploy
      - name: Add the generated test vehicle
        env:
          PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
        run: python tests/seed_preview.py "${{ steps.pub.outputs.url }}"
      - name: Check the preview in a browser
        run: python tests/run_all.py --base "${{ steps.pub.outputs.url }}"
      - name: Where to look
        run: |
          echo "Preview address - ${{ steps.pub.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
