name: Test and preview

# Runs on development branches (stage-*, preview/*) and on pull requests. It never touches production.
#
#  1. Test     - always. Local checks and headless-browser checks with generated data. No secrets, no network to Cloudflare.
#  2. Preview  - only when the repository variable PREVIEW_DEPLOY_READY is "true". Publishes this branch's site/ files to the
#                separate "autospin360-preview" Worker (its own empty test bucket), seeds one generated test vehicle, and
#                re-runs the browser checks against it. Production's Worker, bucket, secrets and settings are never written.
on:
  push:
    branches: ["stage-*", "preview/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/run_all.py

  preview:
    name: Preview Worker (isolated)
    needs: test
    if: >-
      vars.PREVIEW_DEPLOY_READY == 'true' &&
      github.event_name != 'pull_request' &&
      github.repository == 'TRUCKSRUS1997/autospin360-worker'
    runs-on: ubuntu-latest
    environment: preview
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
      PREVIEW_OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps chromium
      - name: Publish the preview
        id: pub
        run: python scripts/deploy_preview.py deploy
      - name: Add the generated test vehicle
        run: python tests/seed_preview.py "${{ steps.pub.outputs.url }}"
      - name: Check the preview in a browser
        run: python tests/run_all.py --base "${{ steps.pub.outputs.url }}"
      - name: Where to look
        run: |
          echo "Preview address - ${{ steps.pub.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
